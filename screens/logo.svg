<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1533"/>
      <stop offset="1" stop-color="#07080f"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="b" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="12"/>
  <!-- split V monogram: two blades that meet at the point -->
  <polygon class="vz-l" points="92,118 190,118 256,300 256,414" fill="url(#a)"/>
  <polygon class="vz-r" points="420,118 322,118 256,300 256,414" fill="url(#b)"/>
  <!-- the eye of the vortex -->
  <polygon class="vz-eye" points="256,120 284,148 256,176 228,148" fill="#fff"/>
</svg>
